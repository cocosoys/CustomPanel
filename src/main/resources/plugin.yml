name: CustomPanel
version: '${project.version}'
main: com.github.cocosoys.mc.custompanel.CustomPanel
author: cocosoys
description: Fully customizable server control panel, mounted as an MCERP module over the SOYSHTTPOverMC HTTP-over-MC tunnel.
# 硬依赖：定位为「纯 MCERP 模块」——菜单、路由、鉴权与侧边栏入口全部由 MCERP 中控提供，
# 缺席则本插件无宿主，故声明为 depend（Bukkit 保证其先于本插件启用，且缺席时直接拒绝启用）。
# SOYSHTTPOverMC 提供网关 / 页面托管 / API 注册 / ORM。
depend: [SOYSHTTPOverMC, MCERP]
permissions:
  custompanel-erp.page.list:
    description: 页面列表
    default: op
  custompanel-erp.page.query:
    description: 页面查询
    default: op
  custompanel-erp.page.add:
    description: 新增页面
    default: op
  custompanel-erp.page.edit:
    description: 编辑页面
    default: op
  custompanel-erp.page.remove:
    description: 删除页面
    default: op
  custompanel-erp.record.list:
    description: 记录列表
    default: op
  custompanel-erp.record.query:
    description: 记录查询
    default: op
  custompanel-erp.record.add:
    description: 新增记录
    default: op
  custompanel-erp.record.edit:
    description: 修改记录
    default: op
  custompanel-erp.record.remove:
    description: 删除记录
    default: op
  custompanel-erp.action.list:
    description: 动作列表
    default: op
  custompanel-erp.action.query:
    description: 动作查询
    default: op
  custompanel-erp.action.add:
    description: 新增动作
    default: op
  custompanel-erp.action.edit:
    description: 编辑动作
    default: op
  custompanel-erp.action.remove:
    description: 删除动作
    default: op
  custompanel-erp.action.execute:
    description: 执行动作
    default: op
  custompanel-erp.managed.list:
    description: 托管实体列表
    default: op
  custompanel-erp.managed.query:
    description: 托管数据查询
    default: op
  custompanel-erp.managed.add:
    description: 新增托管数据
    default: op
  custompanel-erp.managed.edit:
    description: 修改托管数据
    default: op
  custompanel-erp.managed.remove:
    description: 删除托管数据
    default: op
  custompanel-erp.layout.query:
    description: 查询页面布局
    default: op
  custompanel-erp.layout.add:
    description: 保存布局草稿
    default: op
  custompanel-erp.layout.edit:
    description: 发布布局
    default: op
  custompanel-erp.layout.remove:
    description: 删除布局
    default: op
  custompanel-erp.event.list:
    description: 事件列表
    default: op
  custompanel-erp.event.query:
    description: 事件查询
    default: op
  custompanel-erp.event.add:
    description: 新增事件
    default: op
  custompanel-erp.event.edit:
    description: 修改事件
    default: op
  custompanel-erp.event.remove:
    description: 删除事件
    default: op
