# ============================================================
# CustomPanel 配置
# 插件首次启用时自动释放到 plugins/CustomPanel/config.yml
# ============================================================

demo-entity:
  # 是否注册内置演示托管实体 demo-item（复用 PanelRecord 存储验证 MANAGED 链路）。
  # 生产环境建议改为 false，避免演示实体被业务页面绑定写入。
  enabled: true

# ============================================================
# 页面设计器上限（保存/执行时服务端强校验，前端做同阈值预校验）
# ============================================================
designer:
  # 单页控件数上限（超出拒绝保存布局草稿）
  max-fields: 200
  # fieldsJson 字节上限，默认 256 KiB（超出拒绝保存布局草稿）
  max-conf-bytes: 262144
  # 单条内联命令模板字节上限，默认 4 KiB（超出拒绝执行）
  max-inline-target-bytes: 4096
